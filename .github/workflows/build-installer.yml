name: Build Installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Windows NSIS installer + portable package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            aeroforge-service

      - name: Install npm dependencies
        run: npm ci

      - name: Build installer and portable package
        # tauri:build runs beforeBuildCommand (frontend + service + hotkey helper)
        # then Make-Portable.ps1 copies the NSIS setup and packs the portable ZIP.
        run: npm run portable:build

      - name: Upload installer and portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aeroforge-installer-${{ github.sha }}
          path: |
            portable/AeroForge-Control-Setup-*.exe
            portable/AeroForge-Control-Portable-*.zip
            portable/AeroForge-Debug-Collector-*.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
