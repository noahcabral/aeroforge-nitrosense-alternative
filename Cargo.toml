[workspace]
resolver = "2"
members = [
    "aeroforge-service",
    "aeroforge-common",
    "aeroforge-gui",
]

[workspace.package]
version = "0.16.3"
edition = "2021"
rust-version = "1.77.2"
authors = ["Noah Cabral"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
